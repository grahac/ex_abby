version: 2
updates:
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      compatible:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "mix"
    directory: "/example_app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      compatible:
        update-types:
          - "minor"
          - "patch"
