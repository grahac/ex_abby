name: CI

# The hosted suite is opt-in. Every PR push used to spend hosted minutes
# re-running checks the local gate already runs. Label a PR `ci` to request the
# hosted run; without the label the job is skipped and unbilled. Pushes to main
# still run it, because those are direct pushes rather than merge duplicates.
on:
  push:
    branches: [main]
  pull_request:
    # `labeled` must be listed explicitly: GitHub's default PR activities are
    # opened/synchronize/reopened only, so labeling an open PR would otherwise
    # start nothing.
    types: [opened, synchronize, reopened, labeled]

jobs:
  test:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            example_app/deps
            example_app/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      # example_app exercises the database-backed paths against a real repo.
      # Its `test` alias runs ecto.create and ecto.migrate first.
      - name: Install example_app dependencies
        working-directory: example_app
        run: mix deps.get

      - name: Run example_app tests
        working-directory: example_app
        run: mix test
