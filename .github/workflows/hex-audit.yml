name: Hex audit

on:
  pull_request:
    paths:
      - "mix.exs"
      - "mix.lock"
      - "example_app/mix.exs"
      - "example_app/mix.lock"
      - ".github/workflows/hex-audit.yml"
  schedule:
    - cron: "23 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - run: mix local.hex --force
      # hex.audit resolves the dependency tree, so it exits 1 on a fresh
      # checkout with no deps/ — without this the audit is red every run and
      # stops being read.
      - run: mix deps.get
      - run: mix hex.audit

  # example_app has its own mix.lock; the root job above does not see it.
  example_app:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - run: mix local.hex --force
      - run: mix deps.get
        working-directory: example_app
      - run: mix hex.audit
        working-directory: example_app
